name: shadow_learner
description: Shadow Learner — productivity and personal progression by Solo System.
publish_to: 'none'

version: 4.1.19+130
environment:
  sdk: '>=3.8.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  sqflite: ^2.4.2
  path: ^1.9.1
  shared_preferences: ^2.5.3
  flutter_local_notifications: ^18.0.1
  timezone: ^0.9.4
  supabase_flutter: ^2.8.0
  uuid: ^4.5.1
  connectivity_plus: ^6.1.0
  url_launcher: ^6.3.2
  package_info_plus: ^8.3.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  flutter_launcher_icons: ^0.14.4
  flutter_native_splash: ^2.4.6

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/icons/
    - assets/branding/

flutter_launcher_icons:
  android: true
  ios: false
  image_path: assets/branding/app_logo.png
  adaptive_icon_background: "#050B18"
  adaptive_icon_foreground: assets/branding/app_logo.png

flutter_native_splash:
  color: "#050B18"
  image: assets/branding/app_logo.png
  android: true
  ios: false
  android_12:
    color: "#050B18"
    image: assets/branding/app_logo.png
