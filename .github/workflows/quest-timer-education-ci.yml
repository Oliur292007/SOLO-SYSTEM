name: Quest Timer Study Protection Validation

on:
  push:
    branches:
      - feat/quest-timer-app-aware-pause
    paths:
      - 'lib/timetable_page.dart'
      - 'lib/timetable_system.dart'
      - 'lib/study_timer.dart'
      - 'lib/main.dart'
      - 'android/app/src/main/**'
      - 'pubspec.yaml'
      - 'test/**'
      - '.github/workflows/quest-timer-education-ci.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Install Dependencies
        run: flutter pub get

      - name: Analyze Dart Code
        run: flutter analyze --no-pub --no-fatal-infos --no-fatal-warnings

      - name: Run Tests
        run: flutter test

      - name: Build Debug APK
        run: flutter build apk --debug

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: solo-system-quest-timer-debug
          path: build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error
          retention-days: 7
