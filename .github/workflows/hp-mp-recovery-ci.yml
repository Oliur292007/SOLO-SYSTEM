name: HP MP Recovery Validation

on:
  pull_request:
    branches:
      - main
    paths:
      - 'lib/player_system.dart'
      - 'lib/rest_system.dart'
      - 'lib/quest_system.dart'
      - 'lib/study_timer.dart'
      - 'lib/cloud_progress_sync.dart'
      - 'test/**'

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Install Dependencies
        run: flutter pub get

      - name: Analyze Dart Code
        run: flutter analyze --no-pub --no-fatal-infos --no-fatal-warnings

      - name: Run Tests
        run: flutter test
