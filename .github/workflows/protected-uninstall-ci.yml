name: Protected Uninstall Validation

on:
  pull_request:
    branches:
      - main
    paths:
      - 'lib/security_page.dart'
      - 'lib/code_entry_dialog.dart'
      - 'lib/security_controller.dart'
      - 'lib/supabase_service.dart'
      - 'test/**'
      - 'pubspec.yaml'
      - '.github/workflows/protected-uninstall-ci.yml'

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Install Dependencies
        run: flutter pub get

      - name: Analyze Dart Code
        run: flutter analyze --no-pub --no-fatal-infos --no-fatal-warnings

      - name: Run Tests
        run: flutter test
