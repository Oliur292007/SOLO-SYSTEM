name: Shadow Learner Android APK

permissions:
  contents: write

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
      - name: Verify Native Android Configuration
        run: |
          test -f android/app/src/main/kotlin/com/solosystem/shadowlearner/MainActivity.kt
          test -f android/app/src/main/kotlin/com/solosystem/shadowlearner/StudyRestrictionAccessibilityService.kt
          grep -q 'namespace = "com.solosystem.shadowlearner"' android/app/build.gradle.kts
          grep -q 'applicationId = "com.solosystem.shadowlearner"' android/app/build.gradle.kts
          grep -q 'package com.solosystem.shadowlearner' android/app/src/main/kotlin/com/solosystem/shadowlearner/MainActivity.kt
          grep -q 'SCHEDULE_EXACT_ALARM' android/app/src/main/AndroidManifest.xml
          grep -q 'ScheduledNotificationBootReceiver' android/app/src/main/AndroidManifest.xml
      - name: Install Dependencies
        run: flutter pub get
      - name: Download Shadow Learner Logo from Google Drive
        run: |
          mkdir -p assets/branding
          python -m pip install --quiet gdown pillow
          gdown "https://drive.google.com/uc?id=1qHFzrE9r8V4zEE8r43Su1rUHsh6O872F" -O assets/branding/app_logo.png
          python - <<'PY'
          from PIL import Image
          image = Image.open("assets/branding/app_logo.png")
          image.verify()
          image = Image.open("assets/branding/app_logo.png")
          if image.width != image.height:
              raise SystemExit("Logo must be square.")
          print(f"Verified logo: {image.width}x{image.height}")
          PY
      - name: Generate App Icon and Splash from Uploaded Logo
        run: |
          test -s assets/branding/app_logo.png
          dart run flutter_launcher_icons
          dart run flutter_native_splash:create
      - name: Analyze Dart Code
        run: flutter analyze --no-pub --no-fatal-infos --no-fatal-warnings
      - name: Prepare Stable Release Signing
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          test -n "$ANDROID_KEYSTORE_BASE64" || (echo "Missing ANDROID_KEYSTORE_BASE64 repository secret." && exit 1)
          test -n "$ANDROID_KEYSTORE_PASSWORD" || (echo "Missing ANDROID_KEYSTORE_PASSWORD repository secret." && exit 1)
          test -n "$ANDROID_KEY_ALIAS" || (echo "Missing ANDROID_KEY_ALIAS repository secret." && exit 1)
          test -n "$ANDROID_KEY_PASSWORD" || (echo "Missing ANDROID_KEY_PASSWORD repository secret." && exit 1)
          echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > android/app/upload-keystore.jks
          test -s android/app/upload-keystore.jks
      - name: Build Release APK
        env:
          ANDROID_KEYSTORE_PATH: ${{ github.workspace }}/android/app/upload-keystore.jks
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: flutter build apk --release
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: SHADOW-LEARNER-APK
          path: build/app/outputs/flutter-apk/app-release.apk
          retention-days: 14
      - name: Publish GitHub Release
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION_LINE=$(grep '^version:' pubspec.yaml | awk '{print $2}')
          VERSION_NAME=${VERSION_LINE%%+*}
          BUILD_NUMBER=${VERSION_LINE##*+}
          TAG="v${VERSION_NAME}+${BUILD_NUMBER}"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" build/app/outputs/flutter-apk/app-release.apk --clobber
          else
            gh release create "$TAG" build/app/outputs/flutter-apk/app-release.apk \
              --title "Shadow Learner ${VERSION_NAME}" \
              --notes "Shadow Learner Android release ${VERSION_NAME} (build ${BUILD_NUMBER})."
          fi
