name: SOLO SYSTEM Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      # Keep the checked-in Android project. It contains the custom
      # MainActivity MethodChannel, timezone bridge, permissions and
      # Accessibility service required by SOLO SYSTEM.
      - name: Verify Native Android Configuration
        run: |
          test -f android/app/src/main/kotlin/com/example/solo_system/MainActivity.kt
          test -f android/app/src/main/kotlin/com/example/solo_system/StudyRestrictionAccessibilityService.kt
          grep -q 'SCHEDULE_EXACT_ALARM' android/app/src/main/AndroidManifest.xml
          grep -q 'ScheduledNotificationBootReceiver' android/app/src/main/AndroidManifest.xml

      - name: Install Dependencies
        run: flutter pub get

      - name: Build Release APK
        run: flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: SOLO-SYSTEM-APK
          path: build/app/outputs/flutter-apk/app-release.apk
          retention-days: 14
